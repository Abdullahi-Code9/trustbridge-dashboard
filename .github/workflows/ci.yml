name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project layout
        run: |
          test -f package.json
          test -f next.config.mjs
          test -f prisma/schema.prisma
          test -f README.md
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

  visual-regression:
    name: Visual Regression (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npx playwright test tests/e2e/visual.spec.ts

      - name: Upload visual screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

